name: Nightly

# Full CPU suites, started by hand only (no daily schedule).

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cpu-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Cache CPU test data
        uses: actions/cache@v5
        with:
          path: testdata
          key: testdata-${{ hashFiles('tools/fetch-testdata.sh') }}
      - run: bash tools/fetch-testdata.sh
      - name: Full Tom Harte suites + Dormann + ZEXDOC/ZEXALL
        env:
          EMU_TESTDATA_DIR: ${{ github.workspace }}/testdata
          EMU_HARTE_FULL: "1"
        run: |
          cargo test -p cpu-6502 --release -- --ignored
          cargo test -p cpu-z80 --release -- --ignored
          cargo test -p cpu-m68k --release -- --ignored
