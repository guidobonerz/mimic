name: Build

# Release binaries of the desktop and headless frontends for Linux, Windows and
# macOS (Apple Silicon and Intel). Runs only for a pushed version tag `v*` and
# attaches the packages to a GitHub release for that tag. No ROMs are packaged
# (golden rule 6).

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            upx: true
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ""
          - name: windows-x86_64
            upx: true
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
          - name: macos-arm64
            upx: false
            os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
          - name: macos-x86_64
            upx: false
            os: macos-latest
            target: x86_64-apple-darwin
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: System libraries for the desktop frontend (ALSA, udev)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build mimic-desktop and mimic-headless
        run: cargo build --release --locked --target ${{ matrix.target }} -p emu-desktop -p emu-headless
      - name: Version from the tag (v0.2.0 → 0.2.0)
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Collect files
        shell: bash
        run: |
          dir="mimic-$VERSION-${{ matrix.name }}"
          echo "DIR=$dir" >> "$GITHUB_ENV"
          mkdir "$dir"
          # The desktop frontend ships as plain "mimic".
          release="target/${{ matrix.target }}/release"
          cp "$release/mimic-desktop${{ matrix.exe }}" "$dir/mimic${{ matrix.exe }}"
          cp "$release/mimic-headless${{ matrix.exe }}" "$dir/"
          cp README.md "$dir/"
      # Linux and Windows only: UPX leaves macOS binaries unsupported (macOS
      # packing is off by default in UPX and breaks code signing).
      - name: Compress with UPX
        if: matrix.upx
        uses: crazy-max/ghaction-upx@v4
        with:
          version: latest
          files: |
            ${{ env.DIR }}/mimic${{ matrix.exe }}
            ${{ env.DIR }}/mimic-headless${{ matrix.exe }}
          args: --best --lzma
      - name: Package
        shell: bash
        run: |
          dir="$DIR"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: mimic-${{ env.VERSION }}-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
