name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency direction (golden rules 1 and 10)
        run: python3 tools/check-deps.py
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Cache CPU test data
        uses: actions/cache@v4
        with:
          path: testdata
          key: testdata-${{ hashFiles('tools/fetch-testdata.sh') }}
      - name: Fetch CPU test data
        shell: bash
        run: bash tools/fetch-testdata.sh
      # Harte: every 10th test per opcode on push; the full suite runs nightly.
      - name: CPU test suites (Harte sample, Dormann)
        shell: bash
        env:
          EMU_TESTDATA_DIR: ${{ github.workspace }}/testdata
        run: cargo test -p cpu-6502 --release -- --ignored

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Native-only crates are excluded; everything else must stay wasm-compatible.
      - run: >
          cargo build --target wasm32-unknown-unknown --workspace
          --exclude emu-desktop --exclude emu-headless --exclude emu-debug
