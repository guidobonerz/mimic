<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mimic preview</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f4f2; --fg: #1d1d1b; --muted: #6b6b66; --panel: #e6e6e2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecebe6; --muted: #9b9a94; --panel: #242422; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px; background: var(--panel); }
  header strong { margin-right: auto; }
  label { color: var(--muted); }
  select { font: inherit; }
  main { display: flex; justify-content: center; padding: 16px; }
  canvas { max-width: 100%; image-rendering: pixelated; background: #000; }
  #status { font-variant-numeric: tabular-nums; color: var(--muted); padding: 0 16px 16px; text-align: center; }
  .paused { color: #c2410c; font-weight: 600; }
  #panel { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; align-items: center; padding: 0 16px 12px; }
  #panel .switch { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
  #panel button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--muted); background: var(--panel); color: var(--fg); cursor: pointer; }
  #panel button.on { background: #2e6b3a; border-color: #2e6b3a; color: #fff; }
  #overlays { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  details { padding: 0 16px 16px; }
  summary { cursor: pointer; color: var(--muted); }
  #gfxbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 8px 0; }
  #gfxbar input[type=text] { font: inherit; width: 16em; }
  #gfximg { image-rendering: pixelated; max-width: 100%; background: #000; }
  #gfxparams { font: 12px/1.4 ui-monospace, monospace; color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
<header>
  <strong>mimic preview</strong>
  <label>Filter <select id="filter"><option value="raw">raw</option><option value="crt">CRT</option></select></label>
  <label>Scale <select id="scale"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
  <label>FPS <select id="fps"><option>10</option><option>25</option><option selected>50</option></select></label>
  <label title="Sound of the machine (raw filter only)"><input type="checkbox" id="sound"> Sound</label>
  <label title="Keys and gamepads go to the emulated machine (C64: Esc = RUN/STOP, numeric keypad = joystick)"><input type="checkbox" id="input" checked> Input</label>
  <span id="overlays" title="Debug overlays on the raw picture"></span>
  <a href="/crt" target="_blank" rel="noopener" title="Edit a monitor profile">monitor editor</a>
</header>
<main><canvas id="screen" width="384" height="272"></canvas></main>
<div id="panel" aria-label="Console controls"></div>
<div id="status">connecting…</div>
<details id="gfx">
  <summary>Graphics data</summary>
  <div id="gfxbar">
    <label>View <select id="gfxview"></select></label>
    <label title="Options as name=value, e.g. index=2 addr=$2000">Options <input type="text" id="gfxopts" placeholder="index=0 addr=$2000"></label>
    <label>Scale <select id="gfxscale"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
    <label><input type="checkbox" id="gfxlive" checked> Live</label>
  </div>
  <img id="gfximg" alt="">
  <div id="gfxparams"></div>
</details>
<script>
"use strict";
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");
const controls = ["filter", "scale", "fps"].map((id) => document.getElementById(id));
const [filter, scale, fps] = controls;
const sound = document.getElementById("sound");
let socket = null;
let chain = Promise.resolve();

// raw: the /stream endpoint (palette indices, changed lines, audio), coloured
// and scaled here; crt: server-rendered PNGs from /preview.
// Overlays need server-drawn pictures: with any switched on, the raw
// picture also comes as PNGs from /preview.
const overlayBox = document.getElementById("overlays");
function chosenOverlays() {
  return [...overlayBox.querySelectorAll("input:checked")].map((i) => i.value);
}
function connect() {
  if (socket) { socket.onclose = null; socket.close(); }
  const overlays = filter.value === "raw" ? chosenOverlays() : [];
  const raw = filter.value === "raw" && overlays.length === 0;
  if (!raw) aspect = 1;
  const url = raw
    ? `/stream?fps=${fps.value}&audio=${audio ? 1 : 0}`
    : `/preview?format=png&${controls.map((c) => `${c.id}=${c.value}`).join("&")}`
      + (overlays.length ? `&overlay=${overlays.join(",")}` : "");
  pic = null;
  socket = new WebSocket(`ws://${location.host}${url}`);
  socket.binaryType = "arraybuffer";
  socket.onmessage = raw ? (ev) => onRaw(ev.data) : (ev) => { chain = chain.then(() => draw(ev.data)); };
  socket.rawMode = raw;
  socket.onclose = () => { status.textContent = "disconnected – retrying"; setTimeout(connect, 1000); };
}

// Raw pictures are shown at the machine's pixel aspect ratio (from the
// stream header); CRT pictures come from the server already corrected.
let aspect = 1;
function fit() {
  const raw = filter.value === "raw";
  const w = Math.round(canvas.width * scale.value * aspect), h = canvas.height * scale.value;
  canvas.style.width = raw ? `${w}px` : "";
  // The height follows the ratio, also when max-width shrinks the canvas.
  canvas.style.aspectRatio = raw ? `${w} / ${h}` : "";
}

// Raw picture: indices (or RGB) as the server sent them, the palette as
// 32-bit pixels, and an ImageData that is put once per animation frame.
let pic = null, shown = true;
function onRaw(buffer) {
  const v = new DataView(buffer), bytes = new Uint8Array(buffer);
  const magic = String.fromCharCode(...bytes.subarray(0, 4));
  if (magic === "PTRA") return play(v, buffer);
  if (magic !== "PTRV") return;
  const flags = v.getUint8(5), bpp = v.getUint8(6);
  const frame = Number(v.getBigUint64(8, true)), line = v.getUint16(16, true), cycle = v.getUint16(18, true);
  const [w, h, entries, runs] = [20, 22, 24, 26].map((o) => v.getUint16(o, true));
  const par = v.getUint32(28, true) / 65536 || 1;
  if (par !== aspect) { aspect = par; fit(); }
  if (flags & 1 || !pic) {
    const img = ctx.createImageData(w, h);
    pic = { w, h, bpp, idx: new Uint8Array(w * h), pal: new Uint32Array(256), img, px: new Uint32Array(img.data.buffer), top: h, bottom: 0 };
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    fit();
  }
  let o = 32, all = false;
  if (flags & 4) {
    pic.pal.fill(0xff000000);
    for (let i = 0; i < entries; i++, o += 3) pic.pal[i] = 0xff000000 | bytes[o + 2] << 16 | bytes[o + 1] << 8 | bytes[o];
    all = true;
  }
  const len = bpp === 4 ? (w + 1) >> 1 : bpp === 8 ? w : 3 * w;
  for (let r = 0; r < runs; r++) {
    const first = v.getUint16(o, true), count = v.getUint16(o + 2, true);
    o += 4;
    for (let y = first; y < first + count && y < h; y++, o += len) {
      const row = y * w;
      if (bpp === 4) {
        for (let x = 0; x < w; x++) pic.idx[row + x] = x & 1 ? bytes[o + (x >> 1)] >> 4 : bytes[o + (x >> 1)] & 15;
      } else if (bpp === 8) {
        pic.idx.set(bytes.subarray(o, o + w), row);
      } else {
        for (let x = 0; x < w; x++) pic.px[row + x] = 0xff000000 | bytes[o + 3 * x + 2] << 16 | bytes[o + 3 * x + 1] << 8 | bytes[o + 3 * x];
      }
      if (bpp !== 24 && !all) paint(y, y + 1);
    }
  }
  if (all && bpp !== 24) paint(0, h);
  else if (bpp === 24 && runs) { pic.top = 0; pic.bottom = h; }
  const beam = line === 0xffff ? "" : ` · line ${line} cycle ${cycle}`;
  status.innerHTML = `frame ${frame}${beam} ` + (flags & 2 ? '<span class="paused">· paused (partial frame)</span>' : "");
  if (shown) { shown = false; requestAnimationFrame(show); }
}

function paint(from, to) {
  for (let i = from * pic.w; i < to * pic.w; i++) pic.px[i] = pic.pal[pic.idx[i]];
  pic.top = Math.min(pic.top, from);
  pic.bottom = Math.max(pic.bottom, to);
}

function show() {
  shown = true;
  if (!pic || pic.top >= pic.bottom) return;
  ctx.putImageData(pic.img, 0, 0, 0, pic.top, pic.w, pic.bottom - pic.top);
  pic.top = pic.h;
  pic.bottom = 0;
}

// Sound: each message is scheduled right after the previous one, ≈ 60 ms
// ahead; if playback runs dry or too far ahead, it starts over.
let audio = null, playAt = 0;
function play(v, buffer) {
  if (!audio) return;
  const channels = v.getUint8(5), rate = v.getUint32(8, true), n = v.getUint32(12, true);
  const frames = Math.floor(n / channels);
  if (!frames) return;
  const samples = new Int16Array(buffer, 16, n);
  const ab = audio.createBuffer(channels, frames, rate);
  for (let c = 0; c < channels; c++) {
    const data = ab.getChannelData(c);
    for (let i = 0; i < frames; i++) data[i] = samples[i * channels + c] / 32768;
  }
  const now = audio.currentTime;
  if (playAt < now + 0.02 || playAt > now + 0.25) playAt = now + 0.06;
  const src = audio.createBufferSource();
  src.buffer = ab;
  src.connect(audio.destination);
  src.start(playAt);
  playAt += frames / rate;
}

sound.addEventListener("change", () => {
  if (sound.checked) { audio = new AudioContext(); audio.resume(); }
  else if (audio) { audio.close(); audio = null; }
  if (filter.value === "raw") connect();
});

async function draw(buffer) {
  const v = new DataView(buffer);
  if (String.fromCharCode(...new Uint8Array(buffer, 0, 4)) !== "PTPV") return;
  const key = v.getUint8(5) === 0, paused = v.getUint8(7) & 1;
  const frame = Number(v.getBigUint64(8, true)), line = v.getUint16(16, true), cycle = v.getUint16(18, true);
  const [w, h, x, y] = [20, 22, 24, 26].map((o) => v.getUint16(o, true));
  if (key && (canvas.width !== w || canvas.height !== h)) { canvas.width = w; canvas.height = h; fit(); }
  if (buffer.byteLength > 32) {
    const bitmap = await createImageBitmap(new Blob([buffer.slice(32)], { type: "image/png" }));
    ctx.drawImage(bitmap, x, y);
  }
  const beam = line === 0xffff ? "" : ` · line ${line} cycle ${cycle}`;
  status.innerHTML = `frame ${frame}${beam} ` + (paused ? '<span class="paused">· paused (partial frame)</span>' : "");
}

controls.forEach((c) => c.addEventListener("change", () => { fit(); connect(); }));
connect();

// Input: physical keys (KeyboardEvent.code) and standard-mapping gamepads,
// mapped to the machine by the emulator like local host input.
const inputOn = document.getElementById("input");
function send(msg) {
  if (inputOn.checked && socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(msg));
}
function onKey(ev, down) {
  if (!inputOn.checked || ev.target.tagName === "SELECT" || ev.ctrlKey && ev.code === "KeyR") return;
  ev.preventDefault();
  if (down && ev.repeat) return;
  send({ type: "key", code: ev.code, down });
}
window.addEventListener("keydown", (ev) => onKey(ev, true));
window.addEventListener("keyup", (ev) => onKey(ev, false));
window.addEventListener("blur", () => held.forEach((code) => send({ type: "key", code, down: false })));
const held = new Set();
window.addEventListener("keydown", (ev) => held.add(ev.code));
window.addEventListener("keyup", (ev) => held.delete(ev.code));

const BUTTONS = { 0: "South", 1: "East", 2: "West", 3: "North", 4: "LeftShoulder", 5: "RightShoulder",
  8: "Select", 9: "Start", 12: "DPadUp", 13: "DPadDown", 14: "DPadLeft", 15: "DPadRight" };
const pads = new Map();
function pollPads() {
  for (const pad of navigator.getGamepads ? navigator.getGamepads() : []) {
    if (!pad || pad.mapping !== "standard") continue;
    const last = pads.get(pad.index) || { buttons: {}, axes: [0, 0] };
    for (const [i, name] of Object.entries(BUTTONS)) {
      const down = !!pad.buttons[i] && pad.buttons[i].pressed;
      if (down !== !!last.buttons[i]) send({ type: "button", pad: pad.index, button: name, down });
      last.buttons[i] = down;
    }
    ["LeftX", "LeftY"].forEach((axis, i) => {
      const value = Math.abs(pad.axes[i]) < 0.2 ? 0 : Math.round(pad.axes[i] * 100) / 100;
      if (value !== last.axes[i]) send({ type: "axis", pad: pad.index, axis, value });
      last.axes[i] = value;
    });
    pads.set(pad.index, last);
  }
  requestAnimationFrame(pollPads);
}
requestAnimationFrame(pollPads);

// Console panel: the machine's buttons and switches from /controls; a
// button is held while pressed, a click on a switch position sets it.
const panel = document.getElementById("panel");
let panelKey = "";
function control(id, value) {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: "control", id, value }));
}
function renderPanel(controls) {
  const key = JSON.stringify(controls);
  if (key === panelKey) return;
  panelKey = key;
  panel.replaceChildren();
  for (const c of controls) {
    if (c.kind === "button") {
      const b = document.createElement("button");
      b.textContent = c.name;
      b.classList.toggle("on", c.value === 1);
      const release = () => control(c.id, 0);
      b.addEventListener("pointerdown", (ev) => { ev.preventDefault(); b.setPointerCapture(ev.pointerId); control(c.id, 1); });
      b.addEventListener("pointerup", release);
      b.addEventListener("pointercancel", release);
      panel.append(b);
    } else {
      const group = document.createElement("span");
      group.className = "switch";
      group.append(c.name);
      c.positions.forEach((p, i) => {
        const b = document.createElement("button");
        b.textContent = p;
        b.classList.toggle("on", c.value === i);
        b.addEventListener("click", () => control(c.id, i));
        group.append(b);
      });
      panel.append(group);
    }
  }
}
async function loadOverlays() {
  try {
    const list = await (await fetch("/overlays")).json();
    overlayBox.replaceChildren(...list.map((o) => {
      const l = document.createElement("label");
      l.title = o.name;
      const box = document.createElement("input");
      box.type = "checkbox";
      box.value = o.id;
      box.onchange = connect;
      l.append(box, " " + o.id);
      return l;
    }));
  } catch (e) { /* older server: no overlays */ }
}

// Graphics data views: /gfx lists them, /gfx/<id>.png decodes one.
const gfx = document.getElementById("gfx"), gfxView = document.getElementById("gfxview");
const gfxOpts = document.getElementById("gfxopts"), gfxScale = document.getElementById("gfxscale");
const gfxImg = document.getElementById("gfximg"), gfxParams = document.getElementById("gfxparams");
async function loadGfx() {
  try {
    const views = await (await fetch("/gfx")).json();
    gfxView.replaceChildren(...views.map((v) => {
      const o = document.createElement("option");
      o.value = v.id;
      o.textContent = `${v.name} (${v.id})`;
      o.title = "options: " + v.options.join(", ");
      return o;
    }));
    gfx.hidden = views.length === 0;
  } catch (e) { gfx.hidden = true; }
}
function gfxUrl() {
  const q = new URLSearchParams({ scale: gfxScale.value });
  for (const w of gfxOpts.value.split(/\s+/).filter(Boolean)) {
    const [k, v] = w.split("=");
    if (k && v !== undefined) q.set(k, v.replace(/^\$/, "0x"));
  }
  return `/gfx/${gfxView.value}.png?${q}`;
}
function refreshGfx() {
  if (!gfx.open || !gfxView.value) return;
  const img = new Image();
  img.onload = () => { gfxImg.src = img.src; gfxParams.textContent = ""; };
  img.onerror = () => { gfxParams.textContent = "view not available"; };
  img.src = gfxUrl() + `&t=${Date.now()}`;
}
for (const el of [gfxView, gfxOpts, gfxScale]) el.onchange = refreshGfx;
gfx.ontoggle = refreshGfx;
setInterval(() => { if (document.getElementById("gfxlive").checked) refreshGfx(); }, 1000);
loadOverlays();
loadGfx();

async function pollPanel() {
  try {
    const r = await fetch("/controls", { cache: "no-store" });
    if (r.ok) renderPanel(await r.json());
  } catch (_) { /* server gone: keep the last state */ }
  setTimeout(pollPanel, 500);
}
pollPanel();
</script>
</body>
</html>
