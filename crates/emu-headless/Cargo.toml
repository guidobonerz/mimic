[package]
name = "emu-headless"
description = "Headless runner"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "mimic-headless"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
emu-core.workspace = true
emu-cheats.workspace = true
emu-machines.workspace = true
emu-debug.workspace = true
emu-preview.workspace = true
video-crt.workspace = true
media-backends.workspace = true
emu-input.workspace = true
emu-profile.workspace = true

[features]
default = []
# Real hardware (see `--help`): Greaseweazle flux imports and real
# Commodore drives through OpenCBM. Off by default; neither needs anything
# at build time (OpenCBM is loaded at run time).
greaseweazle = ["media-backends/greaseweazle"]
opencbm = ["media-backends/opencbm"]
real-hardware = ["greaseweazle", "opencbm"]
