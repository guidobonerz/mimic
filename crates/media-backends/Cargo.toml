[package]
name = "media-backends"
description = "Media backends: image file, copy-on-write overlay, host directory, real hardware"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Not the workspace's `forbid`: the OpenCBM feature loads a C library at
# run time (src/opencbm/ffi.rs only). Without that feature lib.rs forbids
# unsafe code as everywhere else.
[lints.rust]
unsafe_code = "deny"

[dependencies]
emu-core.workspace = true
media.workspace = true
libloading = { workspace = true, optional = true }
serialport = { workspace = true, optional = true }

[features]
default = []
# Real 1541/1571/1581 drives through OpenCBM (ZoomFloppy/XUM1541 …); the
# library is loaded at run time, nothing links at build time.
opencbm = ["dep:libloading"]
# Flux decoding (PLL, GCR, MFM) into images, without a device.
flux = []
# Greaseweazle flux reader over its USB CDC serial port.
greaseweazle = ["flux", "dep:serialport"]
