[package]
name = "emu-desktop"
description = "Desktop frontend (winit + wgpu + egui)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "mimic-desktop"
path = "src/main.rs"

# Not the workspace's `forbid`: on Windows the program attaches to the
# terminal it was started from with one documented FFI call
# (src/console.rs only); main.rs denies unsafe code everywhere else.
[lints.rust]
unsafe_code = "deny"

[dependencies]
emu-core.workspace = true
emu-machines.workspace = true
emu-debug.workspace = true
emu-preview.workspace = true
video-crt.workspace = true
emu-input.workspace = true
emu-profile.workspace = true
emu-cheats.workspace = true
media-backends.workspace = true
cpal.workspace = true
gilrs.workspace = true
noto-sans-mono-bitmap.workspace = true
png.workspace = true
pollster.workspace = true
rfd.workspace = true
wgpu.workspace = true
winit.workspace = true

[target.'cfg(windows)'.dependencies]
# AttachConsole for the terminal behind the GUI window (src/console.rs).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }
