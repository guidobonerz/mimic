[package]
name = "mimic-preview"
description = "Live preview: frame encoders, snapshot endpoint, WebSocket stream, overlays"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mimic-core.workspace = true
video-crt.workspace = true
png.workspace = true
qoi.workspace = true
# Also on wasm: `vectors_json`, which the debug session uses.
serde_json.workspace = true

# The preview server; the web frontend uses only the encoders.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
