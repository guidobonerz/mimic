[package]
name = "mimic-web"
description = "Web frontend (wasm32)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Not the workspace's `forbid`: the WebAssembly exports need
# `#[no_mangle]` (src/abi.rs only, no `unsafe` blocks).
[lints.rust]
unsafe_code = "deny"

[dependencies]
mimic-core.workspace = true
mimic-machines.workspace = true
mimic-preview.workspace = true
video-crt.workspace = true
mimic-input.workspace = true
mimic-profile.workspace = true
media-backends.workspace = true
mimic-cheats.workspace = true
serde_json.workspace = true

[dev-dependencies]
png.workspace = true
